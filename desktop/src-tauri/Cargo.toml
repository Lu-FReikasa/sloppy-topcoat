[package]
name = "topcoat-desktop"
version = "0.2.0"
description = "Topcoat desktop client: programs in their own windows, a global key for the selector"
edition = "2021"
publish = false

[lib]
name = "topcoat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
