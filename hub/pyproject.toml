[project]
name = "topcoat-hub"
version = "0.1.0"
description = "sloppy-topcoat hub: node registry, API and (later) orchestrator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "cryptography>=44",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "httpx2>=2.13",
    "httpx>=0.27",  # e2e test client
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topcoat_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that blocks fails after this many seconds instead of hanging the run (SCH-01).
timeout = 120
markers = [
  "integration: end-to-end test that needs a built topcoat-node binary",
  "chat_wiki: the test is about Chat reading Topcoat's wiki (switched off for all other tests)",
]
